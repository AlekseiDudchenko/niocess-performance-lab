name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Test
        working-directory: apps/client-app
        run: ./gradlew test

  external-api-simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        working-directory: apps/external-api-simulator
        run: npm test
