server:
  port: ${SERVER_PORT:8080}

external-api:
  base-url: ${EXTERNAL_API_BASE_URL:http://localhost:8090}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/perflab}
    username: ${DB_USER:perflab}
    password: ${DB_PASSWORD:perflab}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

pgasync:
  host: ${PGASYNC_HOST:localhost}
  port: ${PGASYNC_PORT:5432}
  database: ${PGASYNC_DATABASE:perflab}
  username: ${PGASYNC_USER:perflab}
  password: ${PGASYNC_PASSWORD:perflab}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
